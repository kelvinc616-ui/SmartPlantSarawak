steps:
  # Step 1: Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/smartplant-ai', '.' ]

  # Step 2: Push image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/smartplant-ai' ]

  # Step 3: Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - smartplant-ai
      - --image=gcr.io/$PROJECT_ID/smartplant-ai
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --timeout=3600

images:
  - 'gcr.io/$PROJECT_ID/smartplant-ai'
